<div class="app">
  <aside class="side">
    <div class="brand"><div class="emblem">✧</div><div class="brand-txt"><strong>獨自升級</strong><small>TEN PATHS SYSTEM</small></div></div>
    <div class="nav" id="nav">
      <button data-action="nav" data-tab="dashboard" class="active"><span class="ico">◈</span><span class="nav-text">總覽</span></button>
      <button data-action="nav" data-tab="tree"><span class="ico">⌘</span><span class="nav-text">技能樹</span></button>
      <button data-action="nav" data-tab="history"><span class="ico">◷</span><span class="nav-text">修煉紀錄</span></button>
      <button data-action="nav" data-tab="achievements"><span class="ico">✦</span><span class="nav-text">成就</span></button>
      <button data-action="nav" data-tab="settings"><span class="ico">⚙</span><span class="nav-text">設定</span></button>

  </aside>
  <main class="main"><div class="topline"><div class="eyebrow">AWAKENING PROTOCOL · 001</div><div class="top-right" id="today-label"></div></div><div id="view" aria-live="polite"></div><p class="footer-note">TEN PATHS · 修煉是一種承諾，按下升級前請先完成對應練習。資料只保存在目前瀏覽器，記得定期匯出備份。</p></main>
</div>
<dialog id="custom-modal"><form id="custom-form" class="modal-inner"><h2>＋ 自訂技能</h2><p class="subtitle">將新的專精加入目前職業。自訂技能會顯示於技能樹下方，並保留於備份檔。</p><div class="field"><label for="custom-name">技能名稱</label><input id="custom-name" class="input" maxlength="30" required placeholder="例如：機械生物仿生設計"></div><div class="field"><label for="custom-desc">能力定義</label><textarea id="custom-desc" class="area" maxlength="240" required placeholder="這項能力要能做到什麼？"></textarea></div><div class="field"><label for="custom-task">完成一次修煉的標準</label><textarea id="custom-task" class="area" maxlength="240" required placeholder="例如：完成一張仿生結構草圖並標示運作原理"></textarea></div><div class="field"><label for="custom-stage">技能階級</label><select id="custom-stage" class="select"><option value="0">Ⅰ 基礎</option><option value="1">Ⅱ 進階</option><option value="2">Ⅲ 專精</option><option value="3">Ⅳ 宗師</option></select></div><div class="field"><label for="custom-parent">前置技能（可選）</label><select id="custom-parent" class="select"></select></div><div class="modal-actions"><button type="button" class="secondary-btn" data-action="close-modal">取消</button><button type="submit" class="action-btn">加入技能樹</button></div></form></dialog>

w":2,"requires":[{"id":"divination-2-1","level":3}]},{"id":"divination-2-3","name":"負責任的諮詢","desc":"維護尊重、界限、隱私與自主決策。","task":"設計一份不涉及醫療財務斷言的諮詢守則。","stage":3,"row":2,"requires":[{"id":"divination-2-2","level":4},{"id":"divination-0-2","level":2}]}]}]}</script>
<script>
'use strict';
const CATALOG=JSON.parse(document.getElementById('catalog').textContent).professions;
const CAREERS=Object.fromEntries(CATALOG.map(c=>[c.id,c]));
const XP_BY_STAGE=[35,55,80,120],RANK_AT=[1,3,6,10,16,25,40,60,100];
const LEVEL_TAGS=['Ⅰ · 基礎','Ⅱ · 進階','Ⅲ · 專精','Ⅳ · 宗師'];
const STORAGE_KEY='tenpaths_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDay=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const fmtDate=iso=>{try{return new Date(iso).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return iso}};
const uid=()=>`l_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`;
function defaultState(){return {version:1,name:'獨行者',logs:[],custom:[],selectedCareer:'engineering',activeTab:'dashboard',selectedSkill:'engineering-0-0',daily:null}}
function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(x&&typeof x==='object')return {...defaultState(),...x,logs:Array.isArray(x.logs)?x.logs:[],custom:Array.isArray(x.custom)?x.custom:[]}}catch(e){console.warn('Storage unavailable',e)}return defaultState()}
let state=load();
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){alert('目前裝置儲存空間不可用，請立刻匯出備份。')}}
function skills(career){const p=CAREERS[career];return p?[...p.skills,...state.custom.filter(s=>s.career===career)]:[]}
function skillOf(id){for(const c of CATALOG){const f=c.skills.find(s=>s.id===id);if(f)return {...f,career:c.id}}return state.custom.find(s=>s.id===id)||null}
function countOf(id){let n=0;for(const l of state.logs)if(l.skillId===id)n++;return n}
function skillRank(level){return level===0?'尚未修煉':level<3?'入門':level<6?'熟練':level<10?'精通':level<20?'大師':level<40?'宗師':'傳奇'}
function accessible(s){return (s.requires||[]).every(r=>countOf(r.id)>=r.level)}
function professionXP(id){return state.logs.reduce((s,l)=>s+(l.career===id?(Number(l.xp)||0):0),0)}
function levelStart(l,multi=false){const n=l-1;return (multi?195:140)*n+(multi?41:26)*n*n}
function progress(exp,multi=false){let level=1;while(level<10000&&levelStart(level+1,multi)<=exp)level++;const start=levelStart(level,multi),end=levelStart(level+1,multi);return {level,current:exp-start,next:end-start,percent:Math.max(0,Math.min(100,(exp-start)/(end-start)*100)),exp}}
function professionLevel(id){return progress(professionXP(id)).level}
function rankFor(p,level){let i=RANK_AT.findLastIndex(n=>level>=n);const name=p.ranks[Math.max(0,i)];return level>=100?`${name} · 超越${1+Math.floor((level-100)/50)}轉`:name}
function overallXP(){return state.logs.reduce((s,l)=>s+(Number(l.xp)||0),0)}
function overallRank(level){const mastered=CATALOG.filter(c=>professionLevel(c.id)>=6).length;
 if(level>=80&&mastered>=8)return '十界領主';if(level>=50&&mastered>=6)return '多維宗師';if(level>=30&&mastered>=4)return '萬技編織者';if(level>=20&&mastered>=3)return '跨界掌控者';if(level>=12&&mastered>=2)return '多職覺醒者';if(level>=6)return '進階覺醒者';if(level>=3)return '旅途中的修煉者';return '初醒的獨行者'}
const ARCHETYPES=[{icon:'🤖',name:'機甲造物主',need:['engineering','animator'],desc:'機構構造 × 視覺設計'},{icon:'🎬',name:'敘事宇宙創造者',need:['writer','musician','animator'],desc:'文字 × 音樂 × 動畫'},{icon:'🌿',name:'生命鍛造者',need:['chef','athlete','cultivation'],desc:'飲食 × 體能 × 心性'},{icon:'🧭',name:'洞察領航者',need:['ceo','lecturer','divination'],desc:'經營 × 教學 × 象徵詮釋'}];
const ACHIEVEMENTS=[
 {id:'first',icon:'🌱',name:'第一步',desc:'完成任何一次技能修煉。',ok:()=>state.logs.length>=1},
 {id:'ten',icon:'🔥',name:'百鍊之始',desc:'累積 10 次修煉。',ok:()=>state.logs.length>=10},
 {id:'fifty',icon:'⚔️',name:'不懈之刃',desc:'累積 50 次修煉。',ok:()=>state.logs.length>=50},
 {id:'hundred',icon:'🏰',name:'修煉狂人',desc:'累積 100 次修煉。',ok:()=>state.logs.length>=100},
 {id:'multiclass',icon:'🌈',name:'三職覺醒',desc:'至少 3 個職業達到 LV.3。',ok:()=>CATALOG.filter(c=>professionLevel(c.id)>=3).length>=3},
 {id:'fivemaster',icon:'🔱',name:'五域專才',desc:'至少 5 個職業達到 LV.6。',ok:()=>CATALOG.filter(c=>professionLevel(c.id)>=6).length>=5},
 {id:'all',icon:'✴️',name:'十職啟程',desc:'十種職業都完成至少一次修煉。',ok:()=>CATALOG.every(c=>professionXP(c.id)>0)},
 {id:'expert',icon:'💎',name:'專精之證',desc:'任一技能達到 LV.10。',ok:()=>[...CATALOG.flatMap(c=>c.skills),...state.custom].some(s=>countOf(s.id)>=10)},
 {id:'architect',icon:'🏛️',name:'宗師節點',desc:'解鎖並修煉任一四階技能。',ok:()=>state.logs.some(l=>skillOf(l.skillId)?.stage===3)},
 {id:'maker',icon:'🧩',name:'技能開拓者',desc:'自訂至少 1 個擴充技能。',ok:()=>state.custom.length>=1},
 {id:'week',icon:'🌗',name:'七日堅持',desc:'在 7 個不同日子完成修煉。',ok:()=>new Set(state.logs.map(l=>l.day)).size>=7},
 {id:'hundredcareer',icon:'👑',name:'界域領主',desc:'任一職業達到 LV.16。',ok:()=>CATALOG.some(c=>professionLevel(c.id)>=16)}
];
function makeDaily(){const day=localDay();if(state.daily?.day===day&&Array.isArray(state.daily.ids))return;
 const choices=[];for(const c of CATALOG){for(const s of skills(c.id)){if(accessible(s))choices.push({id:s.id,cid:c.id,level:countOf(s.id)})}}
 const seed=[...day].reduce((a,ch)=>a*31+ch.charCodeAt(0),0)>>>0;
 choices.sort((a,b)=>a.level-b.level||(((a.id.length*97+seed+a.id.charCodeAt(a.id.length-1)*71)%311)-((b.id.length*97+seed+b.id.charCodeAt(b.id.length-1)*71)%311)));
 const ids=[],used=new Set();for(let step=0;step<3;step++){const candidates=choices.filter(c=>!used.has(c.cid)&&!ids.includes(c.id));if(!candidates.length)break;const choice=candidates[(seed+step*13)%Math.min(10,candidates.length)];ids.push(choice.id);used.add(choice.cid)}
 state.daily={day,ids};save()}
const dailyDone=id=>state.logs.some(l=>l.day===localDay()&&l.skillId===id);
function bar(percent){return `<div class="bar"><i style="width:${percent.toFixed(2)}%"></i></div>`}
function stats(){const unlocked=CATALOG.reduce((s,c)=>s+skills(c.id).filter(accessible).length,0);return [{name:'修煉總次數',v:state.logs.length},{name:'職業等級總和',v:CATALOG.reduce((x,c)=>x+professionLevel(c.id),0)},{name:'已開放技能',v:unlocked+' / '+(120+state.custom.length)},{name:'成就解鎖',v:ACHIEVEMENTS.filter(a=>a.ok()).length+' / '+ACHIEVEMENTS.length}]}
function dashboard(){makeDaily();const p=progress(overallXP(),true),today=state.logs.filter(l=>l.day===localDay()),title=overallRank(p.level);
 const cards=CATALOG.map(c=>{const stat=progress(professionXP(c.id));return `<button class="prof-card" data-action="pick" data-id="${c.id}" style="--accent:${c.color}"><div class="prof-top"><span class="prof-icon">${c.icon}</span><span class="level-tag">LV. ${stat.level}</span></div><h3>${c.name}</h3><div class="rank">${esc(rankFor(c,stat.level))}</div><div class="meta"><span>修煉 ${state.logs.filter(l=>l.career===c.id).length} 次</span><span>${Math.floor(stat.percent)}%</span></div>${bar(stat.percent)}</button>`}).join('');
 const quests=(state.daily.ids||[]).map(id=>{const s=skillOf(id);if(!s)return '';const done=dailyDone(id),career=CAREERS[s.career];return `<div class="quest ${done?'done':''}"><div class="qinfo"><span class="qico">${career.icon}</span><div><strong>${esc(s.name)}</strong><small>${career.name} · ${done?'今日已完成':'本日委託'}</small></div></div><button class="mini-btn ${done?'done':''}" data-action="open-skill" data-id="${esc(id)}">${done?'✓ 已完成':'前往'}</button></div>`}).join('');
 const properties=[['結構力',['engineering','animator']],['創造力',['writer','musician','animator']],['統御力',['ceo','lecturer']],['生命力',['chef','athlete']],['內觀力',['cultivation','divination']]].map(([name,ids])=>{const xp=ids.reduce((sum,id)=>sum+professionXP(id),0);const val=Math.min(100,Math.floor(12*Math.sqrt(xp/30)));return `<div class="discipline"><span>${name}</span>${bar(val)}<b>${val}</b></div>`}).join('');
 return `<div class="eyebrow">SYSTEM STATUS · ONLINE</div><h1 class="title">你的傳奇，由你自己升級。</h1><p class="subtitle">十個職業，無限進階。真實練習轉化為經驗值，所有成長都可追溯。</p><section class="card hero" style="margin-top:23px"><div class="hero-head"><div class="avatar">✧</div><div><small>總體階級 · ${esc(title)}</small><h2>${esc(state.name)} <span style="color:#e6c38b;font-size:15px">LV. ${p.level}</span></h2><div class="muted" style="font-size:12px">目前總經驗 ${p.exp.toLocaleString('zh-TW')} XP</div></div></div><div class="xp-row"><span>下一個總等級</span><strong>${p.current.toLocaleString('zh-TW')} / ${p.next.toLocaleString('zh-TW')} XP</strong></div>${bar(p.percent)}</section><div class="statgrid">${stats().map(s=>`<div class="card stat"><span>${s.name}</span><strong>${s.v}</strong></div>`).join('')}</div><div class="section-heading"><h2>十職進化圖鑑</h2><p>點擊職業進入技能樹</p></div><div class="profession-grid">${cards}</div><div class="two-col"><section class="card panel"><h3>✦ 今日委託 <span style="font-size:11px;color:var(--muted);font-weight:400">${today.length} 次修煉 · +${today.reduce((s,l)=>s+l.xp,0)} XP</span></h3>${quests||'<div class="muted">今天還沒有委託。</div>'}<p class="small-note">每日自動安排三個不同職業的技能。任務只會在你完成對應修煉後打勾。</p></section><section class="card panel"><h3>◈ 五維能力分析</h3><div class="discipline-list">${properties}</div><p class="small-note">以各領域累積經驗換算，顯示相對成長指標（非標準化能力測驗）。</p></section></div><div class="section-heading"><h2>跨職業隱藏稱號</h2><p>指定職業全達 LV.6 解鎖</p></div><div class="ach-grid">${ARCHETYPES.map(a=>{const ok=a.need.every(id=>professionLevel(id)>=6);return `<div class="card ach ${ok?'unlocked':''}"><div class="badge-ico">${a.icon}</div><h3>${ok?a.name:'？？？隱藏稱號'}</h3><p>${esc(a.desc)}</p><div class="status">${ok?'✦ 已覺醒':`解鎖進度 ${a.need.filter(id=>professionLevel(id)>=6).length} / ${a.need.length}`}</div></div>`}).join('')}</div>`}
function careerChoice(c){return `<button class="choice ${state.selectedCareer===c.id?'active':''}" data-action="career" data-id="${c.id}" style="--accent:${c.color}">${c.icon} ${c.name}</button>`}
function requirements(s){if(!s.requires?.length)return '基礎技能 · 無需前置解鎖';return s.requires.map(r=>{const p=skillOf(r.id);const reached=countOf(r.id)>=r.level;return `${reached?'✓':'🔒'} ${esc(p?.name||'已移除技能')} LV.${r.level}（目前 LV.${countOf(r.id)}）`}).join('　')}
function tree(){const c=CAREERS[state.selectedCareer]||CATALOG[0];state.selectedCareer=c.id;const level=progress(professionXP(c.id));let lines='',nodes='';
 for(const s of c.skills){const x=s.stage*246+27,y=s.row*185+91,on=accessible(s),lv=countOf(s.id);if(s.stage>0){const x0=(s.stage-1)*246+242,x1=x,y0=y+66;lines+=`<path d="M ${x0} ${y0} L ${x1} ${y0}" fill="none" stroke="${on?'#b39c72':'#48576a'}" opacity=".75" stroke-width="${on?'3':'2'}"/>`}if(s.stage===3){const prev=c.skills.find(t=>t.id===s.requires?.[1]?.id);if(prev){let yy=prev.row*185+157;lines+=`<path d="M 734 ${yy} C 760 ${yy},760 ${y+66},${x} ${y+66}" fill="none" stroke="#6d7891" stroke-dasharray="4 6" stroke-width="1" opacity=".4"/>`}}
 nodes+=`<button class="skill-node ${on?'':'locked'} ${lv>=10?'maxed':''} ${state.selectedSkill===s.id?'selected':''}" data-action="select-skill" data-id="${s.id}" style="left:${x}px;top:${y}px" aria-label="${esc(s.name)}，目前 ${lv} 級${on?'':'，尚未解鎖'}"><span class="node-row"><span class="node-tier">${LEVEL_TAGS[s.stage]}</span><span>${on?(lv>0?'◆':'◇'):'🔒'}</span></span><span class="node-name">${esc(s.name)}</span><span class="node-des">${esc(s.desc)}</span><span class="node-foot"><span>${on?skillRank(lv):'前置未達成'}</span><span class="node-lv">LV. ${lv}</span></span></button>`}
 const custom=state.custom.filter(s=>s.career===c.id);let cur=skillOf(state.selectedSkill);if(!cur||cur.career!==c.id){cur=skillOf(c.skills[0].id);state.selectedSkill=cur.id}
 return `<div class="eyebrow">SKILL ASCENSION</div><h1 class="title">職業技能樹</h1><p class="subtitle">依照真實練習逐階升級。後續節點需要先達成前置技能等級。</p><div class="chooser" id="career-chooser" style="margin-top:18px">${CATALOG.map(careerChoice).join('')}</div><section class="card career-head"><div><div class="career-rank">${c.icon} ${esc(rankFor(c,level.level))}</div><h2>${c.name}</h2><p>${c.desc}</p></div><div class="career-level">LV. ${level.level}</div><div class="head-exp"><div class="xp-row" style="margin-top:0"><span>職業 EXP</span><strong>${level.current} / ${level.next} XP · 總計 ${level.exp} XP</strong></div>${bar(level.percent)}</div></section><div class="section-heading"><h2>技能進化路線</h2><button class="mini-btn" data-action="add-skill">＋ 擴充技能</button></div><div class="legend"><span><i class="dot" style="background:#c1a573"></i>已可修煉</span><span><i class="dot" style="background:#607087"></i>前置鎖定</span><span><i class="dot" style="background:#f1d7a6"></i>LV.10 專精標記</span></div><div class="tree-wrap" id="tree-wrap"><div class="tree-canvas"><div class="branch-label" style="top:85px"><span>${esc(c.branches[0])}</span></div><div class="branch-label" style="top:270px"><span>${esc(c.branches[1])}</span></div><div class="branch-label" style="top:455px"><span>${esc(c.branches[2])}</span></div>${LEVEL_TAGS.map((x,i)=>`<div class="stage-head" style="left:${i*246+27}px">${x}</div>`).join('')}<svg class="tree-lines" viewBox="0 0 1040 665" aria-hidden="true">${lines}</svg>${nodes}</div></div><section id="skill-detail">${skillDetail(cur)}</section><div class="section-heading"><h2>自訂擴充技能 <span class="muted" style="font-size:13px">${custom.length}</span></h2></div>${custom.length?`<div class="custom-list">${custom.map(s=>`<button class="custom-item" data-action="select-skill" data-id="${esc(s.id)}">${accessible(s)?'✧':'🔒'} ${esc(s.name)} · LV.${countOf(s.id)}</button>`).join('')}</div>`:`<div class="notice">想發展跨領域專精？按「＋ 擴充技能」加入新能力，例如仿生機甲設計、懸疑動畫分鏡或音樂劇創作。</div>`}`}
function skillDetail(s){const lv=countOf(s.id),on=accessible(s),c=CAREERS[s.career],isCustom=s.id.startsWith('custom_');return `<div class="card detail-card"><div><div class="detail-label">${c.icon} ${c.name} · ${LEVEL_TAGS[s.stage]||'自訂階級'}</div><h3>${esc(s.name)} <span style="color:var(--gold);font-size:14px">LV.${lv}</span></h3><p>${esc(s.desc)}</p><div class="detail-label" style="margin:14px 0 9px">本次修煉挑戰</div><div class="task">${esc(s.task)}</div><div class="requires">${requirements(s)}</div>${isCustom?`<button class="delete-btn" data-action="delete-custom" data-id="${esc(s.id)}">刪除此擴充技能</button>`:''}</div><div class="training"><label class="detail-label" for="train-note">修煉筆記（選填）</label><textarea class="area" id="train-note" maxlength="500" placeholder="記錄完成了什麼、學到什麼，或貼上作品連結…"></textarea><button class="action-btn" data-action="train" data-id="${esc(s.id)}" ${on?'':'disabled'}>${on?'✦ 完成一次修煉 · 升級技能':'🔒 前置技能尚未達成'}</button><div class="small-note">本次 +${XP_BY_STAGE[s.stage]||35} 職業 XP／總 XP，技能 +1 LV。請只在實際完成練習後點擊；等級不設上限。</div></div></div>`}
function history(){let arr=[...state.logs].reverse();return `<div class="eyebrow">TRAINING ARCHIVE</div><h1 class="title">修煉紀錄</h1><p class="subtitle">成長的重量，不在漂亮的稱號，而在每次真實完成的練習。</p><div class="filter-row"><select id="history-filter" class="select" style="max-width:245px"><option value="all">全部職業</option>${CATALOG.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select><span class="muted" style="align-self:center;font-size:12px">最近最多顯示 300 筆（完整紀錄保存在備份中）</span></div><div class="history" id="history-list">${historyRows(arr)}</div>`}
function historyRows(logs){return logs.slice(0,300).map(l=>{const s=skillOf(l.skillId),c=CAREERS[l.career];return `<div class="card log-entry"><div class="log-icon">${c?.icon||'✧'}</div><div><strong>${esc(s?.name||'已刪除技能')} <span class="muted" style="font-size:11px">· ${esc(c?.name||'未知職業')}</span></strong><small>${fmtDate(l.time)}${l.note?' · '+esc(l.note):''}</small></div><div style="text-align:right"><div class="exp-gain">+${Number(l.xp)||0} XP</div><button class="delete-btn" data-action="undo" data-id="${esc(l.id)}">撤銷</button></div></div>`}).join('')||'<div class="empty">還沒有修煉紀錄。選個職業，開啟第一個技能吧。</div>'}
function achievements(){const count=ACHIEVEMENTS.filter(a=>a.ok()).length;return `<div class="eyebrow">HONOR HALL</div><h1 class="title">成就殿堂</h1><p class="subtitle">已解鎖 ${count} / ${ACHIEVEMENTS.length} 個成就。所有成就依你的真實修煉紀錄自動判定。</p><div class="ach-grid" style="margin-top:22px">${ACHIEVEMENTS.map(a=>{const ok=a.ok();return `<div class="card ach ${ok?'unlocked':''}"><div class="badge-ico">${a.icon}</div><h3>${a.name}</h3><p>${a.desc}</p><div class="status">${ok?'✦ 解鎖成功':'◇ 尚未解鎖'}</div></div>`}).join('')}</div><div class="section-heading"><h2>跨界稱號</h2></div><div class="ach-grid">${ARCHETYPES.map(a=>{const done=a.need.filter(id=>professionLevel(id)>=6).length;return `<div class="card ach ${done===a.need.length?'unlocked':''}"><div class="badge-ico">${a.icon}</div><h3>${a.name}</h3><p>${a.desc}</p><div class="status">${done===a.need.length?'✦ 已覺醒':`修煉中 ${done} / ${a.need.length}`}</div></div>`}).join('')}</div>`}
function settings(){return `<div class="eyebrow">SYSTEM CONFIGURATION</div><h1 class="title">系統設定</h1><p class="subtitle">你的成就由你保管。資料預設存在此瀏覽器，無須帳號、不需 API，也不會上傳到伺服器。</p><div class="settings-grid" style="margin-top:22px"><section class="card setting-card"><h3>◇ 冒險者名冊</h3><p>這個名字會出現在主畫面角色檔案。</p><div class="field"><label for="player-name">角色名稱</label><input class="input" id="player-name" value="${esc(state.name)}" maxlength="32"></div><button class="action-btn" data-action="save-name">儲存名稱</button></section><section class="card setting-card"><h3>⇩ JSON 資料備份</h3><p>包含全部十職技能等級、修煉紀錄、擴充技能和個人設定。可跨裝置匯入，亦適合 GitHub 長期保存。</p><div class="flexrow"><button class="action-btn" data-action="export">匯出 JSON</button><button class="secondary-btn" data-action="import">匯入 JSON</button></div></section><section class="card setting-card"><h3>✦ 技能判定規則</h3><p>每完成一次對應實作並按「完成修煉」，技能等級 +1；一至四階分別獲得 35／55／80／120 XP。前置技能通常需 LV.2～4 才能解鎖後續階段。職業等級、稱號和總等級自動計算。</p><p>不設定技能上限，但稱號最高階之後會保留職業等級繼續累積。</p></section><section class="card setting-card"><h3>⚠ 資料安全</h3><p>清除瀏覽器網站資料、改用不同瀏覽器或更換裝置，可能遺失進度。建議每週匯出一次 JSON 備份；匯入會取代目前資料。</p><button class="secondary-btn" style="color:var(--red)" data-action="reset">清除所有進度</button></section></div><div class="notice" style="margin-top:20px">命理研究類別採文化、象徵學與諮詢倫理的學習架構；體能訓練依個人狀態循序進階。系統 XP 是自我追蹤指標，不等同專業資格、健康診斷或技能認證。</div>`}
function render(keepScroll=false){const oldLeft=$('#tree-wrap')?.scrollLeft||0;makeDaily();const view=$('#view');const tab=state.activeTab;view.innerHTML=tab==='dashboard'?dashboard():tab==='tree'?tree():tab==='history'?history():tab==='achievements'?achievements():settings();document.querySelectorAll('#nav [data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});$('#today-label').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});if(keepScroll&&$('#tree-wrap'))$('#tree-wrap').scrollLeft=oldLeft;save()}
let timer;
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2700)}
function goTree(id){let s=skillOf(id);if(!s)return;state.selectedCareer=s.career;state.selectedSkill=id;state.activeTab='tree';render();const n=document.querySelector(`[data-action="select-skill"][data-id="${CSS.escape(id)}"]`);if(n&&$('#tree-wrap'))$('#tree-wrap').scrollLeft=Math.max(0,n.offsetLeft-160);requestAnimationFrame(()=>$('#skill-detail')?.scrollIntoView({behavior:'smooth',block:'nearest'}))}
function makeLog(s,note){if(!accessible(s)){toast('請先完成前置技能');return}const lv=countOf(s.id)+1,now=new Date();state.logs.push({id:uid(),career:s.career,skillId:s.id,time:now.toISOString(),day:localDay(now),xp:XP_BY_STAGE[s.stage]||35,note:note.trim().slice(0,500)});save();render(true);toast(`✦ ${s.name} 升至 LV.${lv}，獲得 +${XP_BY_STAGE[s.stage]} XP`)}
function openCustom(){const s=skills(state.selectedCareer);$('#custom-parent').innerHTML='<option value="">無前置技能</option>'+s.map(x=>`<option value="${esc(x.id)}">${LEVEL_TAGS[x.stage]} · ${esc(x.name)}</option>`).join('');$('#custom-form').reset();$('#custom-modal').showModal()}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;
 if(action==='nav'){state.activeTab=target.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'})}
 if(action==='pick'||action==='career'){state.selectedCareer=id;state.selectedSkill=skills(id)[0]?.id;state.activeTab='tree';render();if(action==='pick')window.scrollTo({top:0,behavior:'smooth'})}
 if(action==='open-skill')goTree(id);
 if(action==='select-skill'){const s=skillOf(id);if(!s)return;state.selectedSkill=id;$('#skill-detail').innerHTML=skillDetail(s);document.querySelectorAll('.skill-node').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));if(!s.id.startsWith('custom_'))document.querySelectorAll('.custom-item').forEach(n=>n.style.borderColor='');else document.querySelectorAll('.custom-item').forEach(n=>n.style.borderColor=n.dataset.id===id?'#d7b17b':'');$('#skill-detail').scrollIntoView({behavior:'smooth',block:'nearest'});save()}
 if(action==='train'){const s=skillOf(id);if(s)makeLog(s,$('#train-note')?.value||'')}
 if(action==='add-skill')openCustom();if(action==='close-modal')$('#custom-modal').close();
 if(action==='save-name'){const val=$('#player-name').value.trim();if(!val){toast('請填寫角色名稱');return}state.name=val;render();toast('角色名已更新')}
 if(action==='export')exportData();if(action==='import')$('#import-file').click();
 if(action==='undo'){if(confirm('撤銷這一次修煉？相關 XP 和技能等級會回復。')){state.logs=state.logs.filter(l=>l.id!==id);render();toast('已撤銷修煉')}}
 if(action==='delete-custom'){if(confirm('刪除此自訂技能及其修煉紀錄？')){state.custom=state.custom.filter(s=>s.id!==id);state.logs=state.logs.filter(l=>l.skillId!==id);state.custom.forEach(s=>s.requires=(s.requires||[]).filter(r=>r.id!==id));state.selectedSkill=skills(state.selectedCareer)[0]?.id;render();toast('擴充技能已刪除')}}
 if(action==='reset'){if(confirm('這會永久清除目前裝置的全部修煉進度，建議先匯出備份。確定要清除？')&&confirm('再次確認：清除全部進度？')){state=defaultState();save();render();toast('進度已重設')}}
});
$('#custom-form').addEventListener('submit',e=>{e.preventDefault();const name=$('#custom-name').value.trim(),desc=$('#custom-desc').value.trim(),task=$('#custom-task').value.trim(),stage=Number($('#custom-stage').value),pid=$('#custom-parent').value;if(!name||!desc||!task)return;if(pid&&skillOf(pid)?.stage>=stage){toast('前置技能需低於新技能的階級');return}const o={id:'custom_'+uid(),career:state.selectedCareer,name,desc,task,stage,row:0,requires:pid?[{id:pid,level:2}]:[]};state.custom.push(o);state.selectedSkill=o.id;$('#custom-modal').close();render();toast('專屬技能已建立')});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const loaded=JSON.parse(await file.text());if(loaded.version!==1||!Array.isArray(loaded.logs)||!Array.isArray(loaded.custom))throw new Error('格式不符');if(loaded.logs.length>100000||loaded.custom.length>5000)throw new Error('檔案資料量過大');const clean={...defaultState(),name:String(loaded.name||'獨行者').slice(0,32),logs:loaded.logs.filter(l=>l&&CAREERS[l.career]&&typeof l.skillId==='string'&&typeof l.id==='string'&&typeof l.xp==='number'&&l.xp>=0&&l.xp<=120).map(l=>({id:l.id,career:l.career,skillId:l.skillId,time:String(l.time||new Date().toISOString()),day:String(l.day||'').slice(0,10),xp:l.xp,note:String(l.note||'').slice(0,500)})),custom:loaded.custom.filter(s=>s&&CAREERS[s.career]&&typeof s.id==='string'&&s.id.startsWith('custom_')&&typeof s.name==='string').map(s=>({...s,name:s.name.slice(0,30),desc:String(s.desc||'').slice(0,240),task:String(s.task||'').slice(0,240),stage:Math.min(3,Math.max(0,Number(s.stage)||0)),requires:Array.isArray(s.requires)?s.requires.slice(0,3).filter(r=>r&&typeof r.id==='string'&&Number.isInteger(r.level)&&r.level>0):[]}))};if(!confirm(`將匯入 ${clean.logs.length} 筆修煉紀錄與 ${clean.custom.length} 個自訂技能。這會覆蓋目前進度，確定繼續？`))return;state=clean;save();render();toast('JSON 備份匯入成功')}catch(error){alert('匯入失敗：'+error.message)}});
function exportData(){const content=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),blob=new Blob([content],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`獨自升級備份_${localDay()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('備份已匯出')}
document.addEventListener('change',e=>{if(e.target.id==='history-filter'){const val=e.target.value;$('#history-list').innerHTML=historyRows([...state.logs].reverse().filter(l=>val==='all'||l.career===val))}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script>
</body>
</html>
